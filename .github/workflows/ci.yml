name: CI

on:
  push:
    branches: [main]
    paths-ignore: &ignore
      - '**.md'
  pull_request:
    paths-ignore: *ignore
  workflow_dispatch:

# A new push to a PR cancels the run for the push before it; runs on main
# always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test -race ./...

  e2e:
    # Real openconnect, built from njvack/openconnect, against fakegp over a
    # real tun device. Only the fake's test subnet is routed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/checkout@v4
        with:
          repository: njvack/openconnect
          ref: ${{ vars.OPENCONNECT_REF || 'macos' }}
          path: openconnect
      - name: Install openconnect build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool pkg-config gettext \
            libxml2-dev libgnutls28-dev liblz4-dev iproute2 iputils-ping
      - name: Build openconnect
        working-directory: openconnect
        run: |
          ./autogen.sh
          ./configure --disable-nls --with-vpnc-script=/bin/true
          make -j"$(nproc)"
      - run: go build -o fakegp ./cmd/fakegp
      - run: sudo e2e/run.sh "$PWD/openconnect/openconnect" "$PWD/fakegp"
